name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: format + html-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npx prettier --check .

      - name: html-validate
        run: npx html-validate "site/**/*.html"

  links:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir resolves the site's root-relative links (/css, /img, …)
          # against site/. Markdown links stay relative to their own file.
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/site"
            --exclude facebook\.com
            "./site/**/*.html"
            "./*.md"
          fail: true
