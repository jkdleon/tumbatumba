name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npx prettier --check .

  links:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # The static site now lives in web/ (Next.js). We link-check the repo's
          # markdown here; the web app's outbound links are covered by its unit
          # tests and `next build`.
          args: >-
            --no-progress
            --exclude facebook\.com
            "./*.md"
            "./web/**/*.md"
          fail: true

  web:
    name: web — typecheck + lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Unit tests
        run: npx vitest run

      - name: Build (static export)
        run: npx next build

      - name: Stock-photo reminder
        run: node scripts/check-no-stock.mjs
